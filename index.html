<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <title>Puja Infinite — Profile Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Return to Puja 1"><span class="brand-mark">P</span><span>PUJA</span></a>
      <div class="jump-wrap">
        <label class="sr-only" for="jumpInput">Jump to Puja number</label>
        <input id="jumpInput" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="Jump to Puja number" aria-describedby="jumpHint">
        <button id="jumpButton" type="button">Jump</button>
      </div>
      <div id="currentPosition" class="position" aria-live="polite"><span>Current profile</span><strong>Puja 1</strong></div>
    </header>
    <p id="jumpHint" class="sr-only">Enter any positive whole number, including values larger than standard JavaScript numbers.</p>

    <section id="scrollViewport" class="scroll-viewport" aria-label="Infinite Puja profile feed" tabindex="0">
      <div class="edge-message top-edge">The Puja universe begins here</div>
      <div id="topSpacer" aria-hidden="true"></div>
      <div id="cardPool" class="card-pool" role="feed" aria-busy="false"></div>
      <div id="bottomSpacer" aria-hidden="true"></div>
      <div class="edge-message bottom-edge">Keep exploring</div>
    </section>
  </main>
  <template id="cardTemplate">
    <article class="profile-card" role="article">
      <div class="card-topline"><span class="sequence">Profile</span><span class="status-dot" title="Active"></span></div>
      <div class="identity-row">
        <div class="avatar" aria-hidden="true"></div>
        <div class="identity"><h2 class="name"></h2><p class="handle"></p></div>
      </div>
      <p class="bio"></p>
      <dl class="details"><div><dt>Location</dt><dd class="location"></dd></div><div><dt>Profession</dt><dd class="profession"></dd></div></dl>
      <div class="interests" aria-label="Interests"></div>
      <div class="metrics"><div><b class="followers"></b><span>Followers</span></div><div><b class="following"></b><span>Following</span></div><div><b class="posts"></b><span>Posts</span></div></div>
      <button class="view-profile" type="button">View Profile <span aria-hidden="true">↗</span></button>
    </article>
  </template>
  <dialog id="profileDialog" class="profile-dialog"><button class="close-dialog" aria-label="Close profile">×</button><div id="dialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
