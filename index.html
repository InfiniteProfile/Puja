<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0e07">
<meta name="description" content="PUJA is an endless gallery of profiles. Every Puja number has its own fixed profile, from Puja 1 to numbers too large to count.">
<title>PUJA — Infinite Profile Generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23241209'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23d9ae45' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23d9ae45'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg-grain"></div></div>

  <header class="bar">
    <div class="brand">
      <h1 class="mark">PUJA</h1>
      <p class="sub">Infinite Profile Generator</p>
    </div>

    <div class="now"><span id="now" class="plate">Puja 1</span></div>

    <div class="controls">
      <form id="jump-form" class="jump" novalidate autocomplete="off">
        <label class="sr-only" for="jump-input">Jump to Puja number</label>
        <input id="jump-input" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Jump to Puja…" aria-describedby="jump-error">
        <button class="btn btn-jump" type="submit">Jump</button>
      </form>

      <div class="actions">
        <button id="btn-prev" class="btn btn-nav" type="button" aria-label="Previous Puja" title="Previous Puja (Up arrow)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <button id="btn-next" class="btn btn-nav" type="button" aria-label="Next Puja" title="Next Puja (Down arrow)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button id="btn-copy" class="btn btn-copy" type="button" aria-label="Copy link to this profile" title="Copy link to this profile">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>
          <span class="lbl">Copy link</span>
        </button>
        <button id="btn-share" class="btn btn-share" type="button" aria-label="Share this profile" title="Share this profile" hidden>
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.3 10.8l7.4-3.6M8.3 13.2l7.4 3.6"/></svg>
          <span class="lbl">Share</span>
        </button>
      </div>
      <p id="jump-error" class="err" role="alert" hidden></p>
    </div>
  </header>

  <main id="viewport" class="viewport" tabindex="0" aria-label="Puja profiles. Scroll, or use the up and down arrow keys, to move between profiles.">
    <div id="track" class="track"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="unsupported" class="notice" hidden>
    This browser can't handle very large numbers (BigInt). Please update your browser to use PUJA.
  </div>
  <noscript><div class="notice">PUJA needs JavaScript to generate profiles. Please turn it on and reload.</div></noscript>
</body>
</html>
