<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puja — Infinite Profile Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="app-header">
        <div class="brand-container">
            <h1 class="brand-title">PUJA</h1>
            <span class="brand-subtitle">INFINITE PROFILE UNIVERSE</span>
        </div>
        <div class="nav-controls">
            <div class="current-indicator">
                <span class="indicator-label">CURRENT PROFILE</span>
                <span id="current-badge" class="indicator-value">Puja 1</span>
            </div>
            <button id="jump-btn" class="gold-btn" title="Jump to specific profile number">Jump to Puja</button>
        </div>
    </header>

    <!-- Main Virtualized Workspace -->
    <main class="viewport-container" id="viewport">
        <!-- Spacer element that mimics the total physical height of the virtual list -->
        <div id="virtual-spacer" class="virtual-spacer"></div>
        <!-- Active rendering container containing recycled profile cards -->
        <div id="card-container" class="card-container"></div>
    </main>

    <!-- Jump Modal Dialog -->
    <div id="jump-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Jump to Sequence Index</h3>
            <p>Enter any integer up to practically infinite scales (supports BigInt &gt; 9.2 quintillion):</p>
            <input type="text" id="jump-input" placeholder="e.g. 5000000 or 9007199254740992" autocomplete="off">
            <div class="modal-actions">
                <button id="modal-cancel" class="btn-secondary">Cancel</button>
                <button id="modal-confirm" class="gold-btn">Teleport</button>
            </div>
        </div>
    </div>

    <!-- Footer Status Bar -->
    <footer class="app-footer">
        <span>Logical State: Unbounded BigInt</span>
        <span class="dot">•</span>
        <span>DOM Nodes: Bounded & Recycled</span>
        <span class="dot">•</span>
        <span>Zero Memory Leak Architecture</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
