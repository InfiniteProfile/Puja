<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUJA — Infinite Profile Generator</title>
    <meta name="description" content="An effectively endless sequence of profiles powered by virtualized client-side rendering and BigInt architecture.">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="brand">
                <h1 class="logo">PUJA</h1>
                <span class="subtitle">Infinite Profile Generator</span>
            </div>
            <div class="header-controls">
                <div class="current-indicator" aria-live="polite">
                    <span class="label">CURRENT</span>
                    <span id="current-puja-number" class="value">Puja 1</span>
                </div>
                <div class="jump-control">
                    <input 
                        type="text" 
                        id="jump-input" 
                        inputmode="numeric" 
                        placeholder="Jump to Puja #..." 
                        aria-label="Jump to specific profile number"
                    >
                    <button id="jump-btn" type="button">Go</button>
                </div>
                <button id="dev-toggle-btn" class="dev-toggle-btn" type="button" title="Toggle Performance Monitor">⚡</button>
            </div>
        </div>
    </header>

    <main class="viewport-container" id="viewport-container">
        <div class="virtual-spacer" id="virtual-spacer">
            <div class="profile-stream" id="profile-stream">
                <!-- Virtualized cards will be recycled and mounted here -->
            </div>
        </div>
    </main>

    <div id="perf-monitor" class="perf-monitor hidden">
        <div>DOM Cards: <span id="perf-dom-count">0</span></div>
        <div>Logical Profile: <span id="perf-logical">1</span></div>
        <div>Scroll Pos: <span id="perf-scroll">0</span></div>
        <div>Cache: <span id="perf-cache">0</span></div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
